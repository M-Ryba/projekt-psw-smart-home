<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Home Login</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="login-container">
      <!-- Login Form -->
      <div id="loginForm" class="form-section active">
        <h2>Smart Home Login</h2>
        <form onsubmit="handleLogin(event)">
          <div class="form-group">
            <label for="username">Username:</label>
            <input type="text" id="username" required />
          </div>
          <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" required />
          </div>
          <button type="submit">Login</button>
          <div id="errorMessage" class="error"></div>
          <div class="form-links">
            <a href="#" onclick="showSection('registerForm')">Create Account</a>
            <a href="#" onclick="showSection('resetForm')">Forgot Password?</a>
          </div>
        </form>
      </div>

      <!-- Register Form -->
      <div id="registerForm" class="form-section">
        <h2>Create Account</h2>
        <form onsubmit="handleRegister(event)">
          <div class="form-group">
            <label for="regUsername">Username:</label>
            <input type="text" id="regUsername" required />
          </div>
          <div class="form-group">
            <label for="regPassword">Password:</label>
            <input type="password" id="regPassword" required />
          </div>
          <div class="form-group">
            <label for="confirmPassword">Confirm Password:</label>
            <input type="password" id="confirmPassword" required />
          </div>
          <button type="submit">Register</button>
          <div class="form-links">
            <a href="#" onclick="showSection('loginForm')">Back to Login</a>
          </div>
          <div id="registerError" class="error"></div>
        </form>
      </div>

      <!-- Reset Password Form -->
      <div id="resetForm" class="form-section">
        <h2>Reset Password</h2>
        <form onsubmit="handlePasswordReset(event)">
          <div class="form-group">
            <label for="resetUsername">Username:</label>
            <input type="text" id="resetUsername" required />
          </div>
          <div class="form-group">
            <label for="oldPassword">Current Password:</label>
            <input type="password" id="oldPassword" required />
          </div>
          <div class="form-group">
            <label for="newPassword">New Password:</label>
            <input type="password" id="newPassword" required />
          </div>
          <button type="submit">Reset Password</button>
          <div class="form-links">
            <a href="#" onclick="showSection('loginForm')">Back to Login</a>
          </div>
          <div id="resetError" class="error"></div>
        </form>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
